[package]
name = "mic-transcription"
version = "0.1.0"
edition = "2021"
description = "Live audio transcription (streaming) example using the Foundry Local Rust SDK"

[[bin]]
name = "mic-transcription"
path = "src/main.rs"

[dependencies]
foundry-local-sdk = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
cpal = "0.15"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
foundry-local-sdk = { version = "1.2", features = ["winml"] }
